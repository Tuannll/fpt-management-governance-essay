name: Build LaTeX PDF

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: essay-pdf
          path: main.pdf

      - name: Publish PDF to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes 2>/dev/null || true
          git tag -d latest 2>/dev/null || true
          git push origin :refs/tags/latest 2>/dev/null || true
          gh release create latest main.pdf \
            --title "Latest PDF Build" \
            --notes "Bản PDF tiểu luận mới nhất được tự động biên dịch từ commit $GITHUB_SHA." \
            --target main

      - name: Publish PDF to branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan pdf
          git reset
          git add -f main.pdf
          git clean -fdx
          git commit -m "build: compile main.pdf [skip ci]"
          git push origin pdf --force
